[project]
name = "outfit-manager"
version = "0.1.0"
description = "Desktop app for tracking outfit rentals"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0",
    "pywebview>=6.2.1",
]

[dependency-groups]
# Packaging into a single executable
build = ["pyinstaller>=6.22.3"]
# Window engine for running from source on Linux (uses the system WebKitGTK)
gtk = ["pygobject>=3.58.1 ; sys_platform == 'linux'"]
# Window engine bundled into the Linux build (self-contained, no system WebKitGTK needed)
qt = [
    "pyqt6>=6.9 ; sys_platform == 'linux'",
    "pyqt6-webengine>=6.9 ; sys_platform == 'linux'",
    "qtpy>=2.4 ; sys_platform == 'linux'",
]
# Installed by default with `uv sync`
dev = [
    { include-group = "build" },
    { include-group = "gtk" },
]
